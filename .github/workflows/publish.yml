# Publishes to npm when a GitHub release is published, authenticating through
# OIDC rather than a stored token. There is no NPM_TOKEN secret here on
# purpose: a long-lived automation token is a credential that can leak, and it
# bypasses the account's 2FA by design.
#
# Prerequisites, one time:
#   1. Publish the first version by hand. npm cannot register a trusted
#      publisher for a package that does not exist yet (npm/cli#8544).
#   2. On npmjs.com, in the package settings, add a trusted publisher pointing
#      at this repository and this workflow file.
#   3. Make the repository public. Provenance is written to a public Sigstore
#      transparency log and is rejected for private repositories.
#
# workflow_dispatch only ever packs, never publishes: a manual run from an
# arbitrary branch would otherwise reach npm without the tag check below.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to check that CI passed on this commit
  id-token: write # OIDC, which is both the credential and the provenance proof

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      # Publishing a release does not wait for CI, and this job is the shorter of
      # the two, so without this it can finish first. prepublishOnly would still
      # run lint, build and the tests, but only here, on one OS and one Node.
      # The matrix and the smoke test live in CI.
      - name: Require CI to have passed on this commit
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            conclusion="$(gh run list --workflow=ci.yml --commit "$GITHUB_SHA" \
              --limit 1 --json conclusion --jq '.[0].conclusion // "pending"')"
            case "$conclusion" in
              success) echo "CI passed on $GITHUB_SHA"; exit 0 ;;
              pending|null|"") echo "waiting for CI on $GITHUB_SHA ($attempt)"; sleep 20 ;;
              *) echo "CI concluded '$conclusion' on $GITHUB_SHA" >&2; exit 1 ;;
            esac
          done
          echo "timed out waiting for CI on $GITHUB_SHA" >&2
          exit 1

      - run: npm ci

      - name: Pack
        if: github.event_name == 'workflow_dispatch'
        run: npm pack --dry-run

      # prepublishOnly runs lint, build and the tests before anything leaves the
      # machine. --provenance is redundant under OIDC but explicit: it turns a
      # repository that is still private into a failed publish rather than a
      # silent one without provenance.
      - name: Publish
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
